[package]
name = "rinexfetch"
# NOTE: on a pre-release version (a "-" suffix), keep
# package.metadata.generate-rpm.version below in sync — RPM's version field
# can't contain "-", so it needs the same value with "-" replaced by "~".
version = "0.3.0-rc.2"
edition = "2024"
description = "Fetch and combine RINEX data from NASA CDDIS for GNSS receiver lab work"
authors = ["Oleksandr Suvorov <cryosay@gmail.com>"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/MrCry0/rinexfetch"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hifitime = "4.3"
thiserror = "2.0"
rpassword = "7.5"
reqwest = { version = "0.13", features = ["blocking"] }
keyring = "4.1"
rinex = "0.22"
flate2 = "1.1"

[package.metadata.deb]
maintainer = "Oleksandr Suvorov <cryosay@gmail.com>"
copyright = "2026, Oleksandr Suvorov <cryosay@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
Fetches and combines RINEX data from NASA's CDDIS archive for a given \
time, GNSS constellation set, and set of ground stations, producing \
standards-compliant RINEX 3.xx or 4.xx output for GNSS receiver \
development lab use. Not a signal generation or RF transmission tool."""
depends = "$auto"
section = "science"
priority = "optional"
assets = [
    ["target/release/rinexfetch", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/rinexfetch/README.md", "644"],
]

[package.metadata.generate-rpm]
# Keep in sync with package.version above on a pre-release: RPM's version
# field forbids "-" (reserved as the name-version-release separator), so a
# SemVer pre-release like "0.3.0-rc.2" needs "-" replaced by RPM's own
# "~" pre-release marker here. Not needed for a plain "X.Y.Z" release with
# no "-" — remove this line then.
version = "0.3.0~rc.2"
assets = [
    { source = "target/release/rinexfetch", dest = "/usr/bin/rinexfetch", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/rinexfetch/README.md", mode = "644", doc = true },
]
