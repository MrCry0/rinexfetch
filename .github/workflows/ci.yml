name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --verbose

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run 2>&1 | tee nextest-output.txt

      - name: Doc tests
        run: cargo test --doc --verbose

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results (${{ matrix.os }})"
            echo
            grep '^ *Summary' nextest-output.txt || echo '(no summary line found; see full output below)'
            echo
            echo '<details><summary>Full test output</summary>'
            echo
            echo '```text'
            cat nextest-output.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (${{ matrix.kind }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            os: ubuntu-latest
            tool: cargo-deb
            build: cargo deb --no-build
            artifact-dir: target/debian
            artifact-glob: '*.deb'
          - kind: rpm
            os: ubuntu-latest
            tool: cargo-generate-rpm
            build: cargo generate-rpm
            artifact-dir: target/generate-rpm
            artifact-glob: '*.rpm'
          - kind: msi
            os: windows-latest
            tool: cargo-wix
            build: cargo wix --no-build --nocapture
            artifact-dir: target/wix
            artifact-glob: '*.msi'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.kind }}

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Install ${{ matrix.tool }}
        run: cargo install ${{ matrix.tool }} --locked

      - name: Build package
        run: ${{ matrix.build }}

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rinexfetch-${{ matrix.kind }}
          path: ${{ matrix.artifact-dir }}/${{ matrix.artifact-glob }}
          if-no-files-found: error

  package-macos-pkg:
    name: Package (macOS .pkg)
    needs: [lint, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-pkg

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Build .pkg
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          pkgroot="$RUNNER_TEMP/pkgroot"
          mkdir -p "$pkgroot/usr/local/bin"
          cp target/release/rinexfetch "$pkgroot/usr/local/bin/"
          pkgbuild --root "$pkgroot" \
            --identifier io.github.mrcry0.rinexfetch \
            --version "$version" \
            --install-location / \
            "rinexfetch-${version}.pkg"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rinexfetch-pkg
          path: '*.pkg'
          if-no-files-found: error
