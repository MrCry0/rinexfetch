name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Run tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package binary tarball
        run: |
          set -euo pipefail
          staging="rinexfetch-${GITHUB_REF_NAME}-x86_64-linux-gnu"
          mkdir -p "$staging"
          cp target/release/rinexfetch README.md LICENSE "$staging"/
          tar czf "${staging}.tar.gz" "$staging"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb --no-build

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Collect and checksum artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp rinexfetch-*.tar.gz dist/
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rinexfetch $GITHUB_REF_NAME" \
            --notes "Packages: .deb (Debian/Ubuntu), .rpm (Fedora), and an x86_64 Linux (glibc) tarball. Verify downloads against SHA256SUMS. See rinexfetch-project-plan.md for the full design."
